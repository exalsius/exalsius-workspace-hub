apiVersion: v2
name: llm-d-model
description: >-
  Serves one LLM for inference with the llm-d stack (llm-d router / GAIE
  InferencePool + vLLM). Attaches to the shared agentgateway from llm-d-infra
  and exposes a per-workspace OpenAI-compatible endpoint. Requires the
  llm-d-infra prerequisite (auto-installed by the operator).
type: application
version: 1.0.0
appVersion: 0.9.0
dependencies:
  - name: llm-d-router-gateway
    alias: igw
    version: v0.10.0
    repository: oci://ghcr.io/llm-d/charts
