{{- $gw := .Values.sharedGateway -}}
{{- $port := .Values.modelServer.port -}}
apiVersion: v1
kind: Service
metadata:
  # "<release>-<endpoint>" is the operator's routing convention; the routing
  # provider looks for exactly this name. ClusterIP only.
  name: {{ .Release.Name }}-http
  labels:
    {{- include "llm-d-model.labels" . | nindent 4 }}
    {{- include "llm-d-model.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ $port }}
  selector:
    # Must select real pods or the mesh announces no endpoint slices. Leaders
    # only — workers run no API server.
    {{- include "llm-d-model.leaderSelectorLabels" . | nindent 4 }}
---
# Redirects the dummy Service to the shared gateway, stamping the model name as
# a trusted header so a client cannot reach another model by changing it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute-redirect
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-http
      sectionName: http
      port: {{ $port }}
  rules:
    - timeouts:
        request: {{ .Values.httpRequestTimeout }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Gateway-Model-Name
                value: {{ .Values.model.name }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ $gw.name }}
          namespace: {{ $gw.namespace }}
          port: {{ $gw.ports.external }}
---
# "chat" AccessEndpoint: a per-model front door to the shared Open WebUI, routed
# per model because the infra prerequisite owns no WorkspaceClass (docs/adr/0006).
#
# Two non-obvious constraints, both from the operator federating this Service as
# an ambient global service:
#   - the port must be one the backing pods actually serve (modelServer.port,
#     not 80), or Istio publishes no endpoints and the request 503s upstream;
#   - the backend must be the gateway, not Open WebUI directly — the waypoint
#     only forms healthy upstreams to mesh-native destinations.
apiVersion: v1
kind: Service
metadata:
  # "<release>-<endpoint>" routing convention, as above.
  name: {{ .Release.Name }}-chat
  labels:
    {{- include "llm-d-model.labels" . | nindent 4 }}
    {{- include "llm-d-model.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    # The pods' real port — see above.
    - name: chat
      port: {{ $port }}
      appProtocol: http
  selector:
    # Leaders only, as -http above.
    {{- include "llm-d-model.leaderSelectorLabels" . | nindent 4 }}
---
# Redirect traffic from the "<release>-chat" dummy service to the shared Open WebUI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-chat-redirect
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-chat
      sectionName: chat
      port: {{ $port }}
  rules:
    - backendRefs:
        # The gateway's "webui" listener, which forwards to Open WebUI.
        - group: ""
          kind: Service
          name: {{ $gw.name }}
          namespace: {{ $gw.namespace }}
          port: {{ $gw.ports.webui }}
---
# Both redirect backends live in another namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ .Release.Name }}-httproute-referencegrant
  namespace: {{ $gw.namespace }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: {{ .Release.Namespace }}
  to:
    - group: ""
      kind: Service
---
# Routes to this model's InferencePool on the X-Gateway-Model-Name header, split
# per listener so the optional API-key policy can gate `external` while leaving
# `internal` open for cluster-internal consumers (auth.yaml).
#
# Hand-written rather than the router chart's httpRoute.create, which renders one
# route with no sectionName and so cannot be pinned to a listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute-external
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: {{ $gw.listeners.external }}
  rules:
    {{- include "llm-d-model.modelRouteRules" . | nindent 4 }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute-internal
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $gw.name }}
      namespace: {{ $gw.namespace }}
      sectionName: internal
  rules:
    {{- include "llm-d-model.modelRouteRules" . | nindent 4 }}
