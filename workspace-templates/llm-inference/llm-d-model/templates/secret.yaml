{{- if .Values.huggingfaceToken }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-d-model.authSecretName" . }}
  labels:
    {{- include "llm-d-model.labels" . | nindent 4 }}
stringData:
  HF_TOKEN: {{ .Values.huggingfaceToken | quote }}
{{- end }}
{{- if .Values.inferenceApiKey }}
---
# Separate from the model-auth secret above: agentgateway treats every entry in
# the referenced secret as a valid API key, so HF_TOKEN must not live here.
# One entry per accepted key; the entry name is arbitrary.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-external-apikey
  labels:
    {{- include "llm-d-model.labels" . | nindent 4 }}
stringData:
  api-key: {{ .Values.inferenceApiKey | quote }}
{{- end }}
