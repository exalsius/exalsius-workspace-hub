{{- if .Values.inferenceApiKey }}
# Gates the per-workspace public endpoint. Attached to the external route only,
# leaving the internal path keyless for Open WebUI. Strict: requests without a
# valid `Authorization: Bearer <key>` are rejected at the gateway.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: {{ .Release.Name }}-external-apikey
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Release.Name }}-httproute-external
  traffic:
    apiKeyAuthentication:
      mode: Strict
      secretRef:
        name: {{ .Release.Name }}-external-apikey
{{- end }}
