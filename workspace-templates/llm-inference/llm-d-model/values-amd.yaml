# Operator injection for an AMD GPU node.
# Expect: limits[amd.com/gpu]=1, no runtimeClassName (NVIDIA-only).
modelServer:
  # The AMD sibling of the default llm-d-cuda.
  image: ghcr.io/llm-d/llm-d-rocm:v0.9.0
_exalsius:
  resources:
    replicas: 1
    perReplica:
      cpu: "16"
      memory: "64Gi"
      storage: "100Gi"
      gpuCount: 1
      gpuVendor: "AMD"
      gpuResourceName: "amd.com/gpu"
  scheduling:
    nodeSelector:
      amd.com/gpu.family: "MI300"
