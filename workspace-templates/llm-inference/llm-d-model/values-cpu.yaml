# Operator injection for a CPU-only node, using the inference simulator.
# Expect: no accelerator, no runtimeClassName, no --tensor-parallel-size.
modelServer:
  image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
  command: []
  argsOverride:
    - "--model=Qwen/Qwen3-1.7B"
    - "--port=8000"
_exalsius:
  resources:
    replicas: 1
    perReplica:
      cpu: "4"
      memory: "8Gi"
      storage: "20Gi"
