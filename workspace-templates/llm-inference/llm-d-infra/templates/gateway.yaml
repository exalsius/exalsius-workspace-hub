{{- /*
The single shared inference gateway every llm-d-model attaches to (docs/adr/0007).

Three listeners, kept separate so policy can differ per listener:
  external (:80)   model workspaces; carries each model's optional API-key policy
  internal (:8080) Open WebUI's model calls and discovery, deliberately keyless
  webui    (:8081) fronts Open WebUI; target of each model's "chat" redirect

The AgentgatewayParameters is what makes the gateway's own Service a ClusterIP;
without it agentgateway provisions a LoadBalancer, outside operator routing
(docs/adr/0002).
*/ -}}
{{- if .Values.gateway.enabled }}
{{- if .Values.gateway.parameters.enabled }}
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: {{ include "llm-d-infra.gatewayName" . }}
  labels:
    {{- include "llm-d-infra.labels" . | nindent 4 }}
    app.kubernetes.io/gateway: {{ include "llm-d-infra.gatewayName" . }}
    app.kubernetes.io/component: inference-gateway
spec:
  logging:
    level: {{ .Values.gateway.parameters.logLevel | quote }}
  {{- with .Values.gateway.parameters.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  service:
    metadata:
      labels:
        gateway: custom
    spec:
      type: {{ .Values.gateway.service.type | quote }}
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "llm-d-infra.gatewayName" . }}
  labels:
    {{- include "llm-d-infra.labels" . | nindent 4 }}
    app.kubernetes.io/gateway: {{ include "llm-d-infra.gatewayName" . }}
    app.kubernetes.io/component: inference-gateway
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName | quote }}
  listeners:
    {{- toYaml (required "gateway.listeners must have at least 1 item" .Values.gateway.listeners) | nindent 4 }}
  {{- if .Values.gateway.parameters.enabled }}
  infrastructure:
    parametersRef:
      name: {{ include "llm-d-infra.gatewayName" . }}
      group: agentgateway.dev
      kind: AgentgatewayParameters
  {{- end }}
{{- end }}
