# Fronts Open WebUI behind the gateway's "webui" listener.
#
# Each model's "chat" endpoint redirects to this listener rather than to the Open
# WebUI Service, because the per-model redirect rides the ambient waypoint, which
# only forms healthy upstreams to mesh-native destinations. The gateway can dial
# Open WebUI directly, so it does the final hop (docs/adr/0006).
#
# No hostname match: everything on this listener goes to Open WebUI.
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "llm-d-infra.gatewayName" . }}-open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "llm-d-infra.gatewayName" . }}
      sectionName: webui
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.ow.fullnameOverride }}
          port: {{ .Values.ow.service.port | default 80 }}
{{- end }}
