# agentgateway control plane (upstream subchart).
agentgateway:
  # Wires the controller to GAIE so it can route to the InferencePools the
  # per-model endpoint pickers own.
  inferenceExtension:
    enabled: true
  # The AgentgatewayModel API: request-body model matching and an
  # OpenAI-compatible /v1/models. Off by default upstream, still experimental
  # there (docs/adr/0008).
  agentgatewayModels:
    enabled: true

# The shared inference gateway, rendered by templates/gateway.yaml rather than
# passed to a subchart (docs/adr/0007).
gateway:
  enabled: true
  # Fixed name: models in other namespaces and releases attach to it by name.
  name: llm-d-inference-gateway
  gatewayClassName: agentgateway
  listeners:
    # Model workspaces, via HTTPRoutes.
    - name: external
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # Open WebUI. Admitting AgentgatewayModel turns on agentgateway's built-in
    # LLM paths here: body-based model matching plus /v1/models across every
    # attached model (docs/adr/0008). HTTPRoute is deliberately not admitted.
    - name: internal
      port: 8080
      protocol: HTTP
      allowedRoutes:
        kinds:
          - group: agentgateway.dev
            kind: AgentgatewayModel
        namespaces:
          from: All
    # Fronts Open WebUI. Each model's "chat" endpoint redirects here rather than
    # to the Open WebUI Service, because the per-model redirect rides the ambient
    # waypoint and that only reaches mesh-native upstreams (docs/adr/0006).
    - name: webui
      port: 8081
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
  service:
    # ClusterIP — routing is operator-owned (docs/adr/0002).
    type: ClusterIP
  # Rendered as AgentgatewayParameters and referenced from the Gateway. This is
  # what pins the data-plane Service to `service.type`; without it agentgateway
  # defaults to LoadBalancer.
  parameters:
    enabled: true
    logLevel: warn
    resources:
      limits:
        cpu: "2"
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 128Mi

# LeaderWorkerSet controller (upstream subchart). Required for any model; the
# toggle is for clusters where a platform team already manages LWS.
lws:
  enabled: true
  # Below the upstream 1 CPU / 1Gi, which is disproportionate on small child
  # clusters. Raise it on a cluster running many LeaderWorkerSets.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # For P/D-disaggregated serving, which this stack does not deploy. The CRD is
  # installed either way.
  enableDisaggregatedSet: false

ow:
  # Fixed name so each model can target it cross-namespace as the backend of its
  # "chat" redirect (docs/adr/0006).
  fullnameOverride: llm-d-open-webui
  enableOpenaiApi: true
  openaiBaseApiUrl: http://llm-d-inference-gateway:8080/v1
  image:
    pullPolicy: Always
  ollama:
    enabled: false
  pipelines:
    enabled: false
  tika:
    enabled: false
  websocket:
    enabled: false
